name: Build Helper APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Scaffold Android project
        run: |
          rm -rf android
          flutter create . --project-name puppypay_helper --org com.puppypay --platforms=android

      - name: Configure applicationId + permissions
        run: |
          set -e
          APP_GRADLE=android/app/build.gradle.kts
          sed -i 's/applicationId = ".*"/applicationId = "com.puppypay.helper"/' "$APP_GRADLE"

          python3 - <<'PY'
from pathlib import Path
p = Path("android/app/src/main/AndroidManifest.xml")
t = p.read_text()
perms = '''
    <uses-permission android:name="android.permission.INTERNET"/>
    <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>
    <uses-permission android:name="android.permission.WAKE_LOCK"/>
    <uses-permission android:name="android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS"/>
    <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED"/>
    <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>
'''
if "REQUEST_IGNORE_BATTERY_OPTIMIZATIONS" not in t:
    t = t.replace("<application", perms + "    <application", 1)
    p.write_text(t)
print("manifest ok")
print(p.read_text()[:800])
PY

      - run: flutter pub get

      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: PuppyPay-Helper-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
