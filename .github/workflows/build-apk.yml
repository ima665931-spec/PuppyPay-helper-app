name: Build Helper APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Scaffold Android project
        run: |
          rm -rf android
          flutter create . --project-name puppypay_helper --org com.puppypay --platforms=android

      - name: Configure applicationId + permissions + listener service
        run: |
          set -e
          APP_GRADLE=android/app/build.gradle.kts
          MANIFEST=android/app/src/main/AndroidManifest.xml
          sed -i 's/applicationId = ".*"/applicationId = "com.puppypay.helper"/' "$APP_GRADLE"

          # Permissions
          sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>\n    <uses-permission android:name="android.permission.WAKE_LOCK"/>\n    <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED"/>\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>\n    <application|' "$MANIFEST"

          # NotificationListenerService binding (required by package)
          if ! grep -q 'NotificationListener' "$MANIFEST"; then
            sed -i 's|</application>|        <service android:name="notification.listener.service.NotificationListener" android:label="PuppyPay Helper" android:permission="android.permission.BIND_NOTIFICATION_LISTENER_SERVICE" android:exported="true">\n            <intent-filter>\n                <action android:name="android.service.notification.NotificationListenerService" />\n            </intent-filter>\n        </service>\n    </application>|' "$MANIFEST"
          fi

          echo "--- manifest head ---"
          head -50 "$MANIFEST"

      - run: flutter pub get

      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: PuppyPay-Helper-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
